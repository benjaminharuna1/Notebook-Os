<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  
  <!-- Connection lines -->
  <line x1="32" y1="16" x2="16" y2="48" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="48" y2="48" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="48" x2="48" y2="48" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Nodes -->
  <circle cx="32" cy="16" r="8" fill="url(#grad)"/>
  <circle cx="16" cy="48" r="6" fill="#a5b4fc"/>
  <circle cx="48" cy="48" r="6" fill="#a5b4fc"/>
  
  <!-- Inner highlights -->
  <circle cx="32" cy="16" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="16" cy="48" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="48" cy="48" r="2" fill="#fff" opacity="0.3"/>
</svg>
